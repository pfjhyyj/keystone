# Internal image and recovery verification fixture over deploy/stack/compose.yaml;
# development dependencies use deploy/compose.yaml.
name: keystone-package-verification

x-backend: &backend
  # These isolated containers share one physical host, including after recreation.
  hostname: keystone-verification
  build:
    context: ../../backend
  environment:
    KEYSTONE_ENV: ${KEYSTONE_ENV:-development}
    KEYSTONE_CREDENTIAL_KEY: ${KEYSTONE_CREDENTIAL_KEY:?Set the isolated verification key}
    KEYSTONE_LOG_LEVEL: ${KEYSTONE_LOG_LEVEL:-INFO}
    KEYSTONE_BROWSER_ORIGINS: '${KEYSTONE_BROWSER_ORIGINS:-["http://127.0.0.1:8080","http://localhost:8080"]}'
    KEYSTONE_SESSION_HOURS: ${KEYSTONE_SESSION_HOURS:-72}
    KEYSTONE_PAT_MAX_DAYS: ${KEYSTONE_PAT_MAX_DAYS:-90}
    KEYSTONE_FILE_MAX_BYTES: ${KEYSTONE_FILE_MAX_BYTES:-16777216}
  volumes:
    - type: bind
      source: ./backend.toml
      target: /app/keystone.toml
      read_only: true

services:
  postgres:
    extends:
      file: ../../deploy/stack/compose.yaml
      service: postgres
    ports:
      - "127.0.0.1:${KEYSTONE_POSTGRES_PORT:-55432}:5432"

  init:
    <<: *backend
    extends:
      file: ../../deploy/stack/compose.yaml
      service: init

  api:
    <<: *backend
    extends:
      file: ../../deploy/stack/compose.yaml
      service: api
    ports:
      - "127.0.0.1:${KEYSTONE_API_PORT:-8000}:8000"

  worker:
    <<: *backend
    extends:
      file: ../../deploy/stack/compose.yaml
      service: worker
    stop_grace_period: 15s

  console:
    extends:
      file: ../../deploy/stack/compose.yaml
      service: console
    build:
      context: ../../frontend/console

volumes:
  postgres_data:
  file_data:
