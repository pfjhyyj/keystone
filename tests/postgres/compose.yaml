# Dedicated to parallel pytest and browser tests; never stores application data.
name: keystone-tests

services:
  postgres:
    image: ${KEYSTONE_POSTGRES_IMAGE:-postgres:17.11-alpine}
    # Eight test processes can each run an API and two real DBOS Workers.
    command: ["postgres", "-c", "max_connections=512"]
    environment:
      POSTGRES_DB: keystone_test
      POSTGRES_USER: keystone_test
      POSTGRES_PASSWORD: isolated-test-only
    ports:
      - "127.0.0.1:${KEYSTONE_TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone_test -d keystone_test"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
