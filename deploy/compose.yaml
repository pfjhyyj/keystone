name: keystone

# Development dependencies only. Run API, Worker and frontend on the host.
services:
  postgres:
    image: ${KEYSTONE_POSTGRES_IMAGE:-postgres:17.11-alpine}
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone_local_only}
    ports:
      - "127.0.0.1:${KEYSTONE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
