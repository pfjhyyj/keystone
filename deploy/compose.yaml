name: keystone

# Development dependencies only. Run API, Worker and frontend on the host.
services:
  postgres:
    image: ${KEYSTONE_POSTGRES_IMAGE:-postgres:17.11-alpine}
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone_local_only}
    ports:
      - "127.0.0.1:${KEYSTONE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Optional, for interactive environments: --profile environments. Sandboxes are created on
  # this host's Docker engine and reached only through this server's proxy.
  opensandbox:
    image: opensandbox/server:release-1.2.0
    profiles: ["environments"]
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${KEYSTONE_OPENSANDBOX_KEY:-opensandbox_local_only}
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    ports:
      - "127.0.0.1:${KEYSTONE_OPENSANDBOX_PORT:-8090}:8090"
    networks:
      - default
      - browser_runtime
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./environments/opensandbox.dev.toml:/etc/opensandbox/config.toml:ro
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  browser_runtime:
    name: keystone_browser_runtime
