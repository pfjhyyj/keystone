limit_req_zone $binary_remote_addr zone=keystone_login:1m rate=10r/m;

# Docker's embedded DNS follows API container recreation without restarting console.
resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 5s;
upstream keystone_api {
    zone keystone_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    # Preserve the public port and scheme when running behind a mapped port or proxy.
    absolute_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16m;
    client_body_timeout 60s;

    location = / { return 302 /console/; }
    location = /console { return 301 /console/; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/v1/auth/login {
        limit_req zone=keystone_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://keystone_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://keystone_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
    }
    location /console/assets/ {
        try_files $uri =404;
    }
    location /console/ {
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
