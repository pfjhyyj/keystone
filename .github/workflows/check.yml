name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: Build containers and verify deployment/recovery too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete diff
        id: scope
        run: python scripts/ci_scope.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-console
      - name: Format, unit tests, types and build
        run: python scripts/check.py --scope frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-frontend
          retention-days: 14
          include-hidden-files: true
          path: |
            .artifacts/checks/**/result.json

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KEYSTONE_TEST_DATABASE_URL: postgresql+psycopg://keystone_test:isolated-test-only@127.0.0.1:55433/keystone_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start dedicated test database
        run: docker compose -f tests/postgres/compose.yaml up -d --wait
      # uv 0.10.2 predates this Python release; install it independently of uv's catalog.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.2'
          python-version: '3.12.14'
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked --project backend
      - name: Lint, unit/integration tests and package
        run: backend/.venv/bin/python scripts/check.py --scope backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-backend
          retention-days: 14
          include-hidden-files: true
          path: |
            .artifacts/checks/**/result.json
            .artifacts/checks/**/pytest.xml
      - name: Stop test database
        if: always()
        run: docker compose -f tests/postgres/compose.yaml down --volumes

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEYSTONE_TEST_DATABASE_URL: postgresql+psycopg://keystone_test:isolated-test-only@127.0.0.1:55433/keystone_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uv 0.10.2 predates this Python release; install it independently of uv's catalog.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.2'
          python-version: '3.12.14'
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked --project backend
      - uses: ./.github/actions/setup-console
        with:
          browser: 'true'
      - name: Start dedicated test database
        run: docker compose -f tests/postgres/compose.yaml up -d --wait
      - name: Real API, Worker and browser regression
        run: backend/.venv/bin/python scripts/check.py --scope browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-browser
          retention-days: 14
          include-hidden-files: true
          path: |
            .artifacts/checks/**/result.json
            .artifacts/console-e2e/
      - name: Stop test database
        if: always()
        run: docker compose -f tests/postgres/compose.yaml down --volumes

  deployment:
    needs: [backend, frontend, browser]
    if: github.event_name == 'workflow_dispatch' && inputs.deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uv 0.10.2 predates this Python release; install it independently of uv's catalog.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.2'
          python-version: '3.12.14'
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked --project backend
      - uses: ./.github/actions/setup-console
        with:
          browser: 'true'
      - name: Deployment and recovery only
        run: backend/.venv/bin/python tests/deploy/verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-deployment
          retention-days: 14
          include-hidden-files: true
          path: |
            .artifacts/deploy-verify/**/result.json
            .artifacts/deploy-verify/**/build.log
            .artifacts/deploy-verify/**/compose.log

  # Keep the existing required check name; selected jobs must actually pass.
  check:
    needs: [changes, backend, frontend, browser, deployment]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          DEPLOYMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          if jobs['changes']['result'] != 'success':
              raise SystemExit('Change detection failed')
          failures = []
          for scope in ('backend', 'frontend', 'browser'):
              selected = jobs['changes']['outputs'][scope] == 'true'
              accepted = {'success'} if selected else {'success', 'skipped'}
              if jobs[scope]['result'] not in accepted:
                  failures.append(f'{scope}: {jobs[scope]["result"]}')
          if os.environ['DEPLOYMENT'] == 'true' and jobs['deployment']['result'] != 'success':
              failures.append('Deployment verification failed')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('All selected checks passed')
          PY
