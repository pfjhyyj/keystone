name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: Build containers and verify deployment/recovery too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTONE_TEST_DATABASE_URL: postgresql+psycopg://keystone_test:isolated-test-only@127.0.0.1:55433/keystone_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start dedicated test database
        run: docker compose -f tests/postgres/compose.yaml up -d --wait
      # uv 0.10.2 predates this Python release; install it independently of uv's catalog.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.2'
          python-version: '3.12.14'
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install backend dependencies
        run: uv sync --locked --project backend
      - name: Install frontend dependencies and browser
        working-directory: frontend/console
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Full validation
        env:
          VERIFY_DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          if [ "$VERIFY_DEPLOYMENT" = "true" ]; then
            backend/.venv/bin/python scripts/check.py --deploy
          else
            backend/.venv/bin/python scripts/check.py
          fi
      - name: Save validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          retention-days: 14
          include-hidden-files: true
          path: |
            .artifacts/checks/**/result.json
            .artifacts/checks/**/pytest.xml
            .artifacts/console-e2e/
            .artifacts/deploy-verify/**/result.json
            .artifacts/deploy-verify/**/build.log
            .artifacts/deploy-verify/**/compose.log
      - name: Stop test database
        if: always()
        run: docker compose -f tests/postgres/compose.yaml down --volumes
